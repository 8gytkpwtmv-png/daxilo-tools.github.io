<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAXILO — онлайн-инструменты</title><meta name="description" content="Бесплатные онлайн-инструменты DAXILO для текста, JSON, URL, Base64 и изображений."><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:24px}main{max-width:1000px;margin:35px auto;padding:0 18px}h1{font-size:38px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:white;padding:20px;border-radius:14px;border:1px solid #ddd}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:7px 0;border:1px solid #ccd2dc;border-radius:9px}button{padding:10px 13px;border:0;border-radius:9px;background:#111827;color:white;margin:3px;cursor:pointer}.out{white-space:pre-wrap;word-break:break-word;margin-top:10px}</style></head><body><header><b style="font-size:28px">DAXILO</b><div>Простые цифровые инструменты в одном месте.</div></header><main><h1>Бесплатные онлайн-инструменты</h1><p>Работают прямо в браузере.</p><div class="grid"><section class="card"><h2>Счётчик слов</h2><textarea id="w" rows="5" placeholder="Введите текст"></textarea><div id="wo">Слов: 0 · Символов: 0</div></section><section class="card"><h2>Регистр текста</h2><textarea id="c" rows="4" placeholder="Введите текст"></textarea><button onclick="co('u')">ВЕРХНИЙ</button><button onclick="co('l')">нижний</button><button onclick="co('t')">Заглавные</button><textarea id="co" rows="4" readonly></textarea></section><section class="card"><h2>JSON Formatter</h2><textarea id="j" rows="5" placeholder='{"name":"DAXILO"}'></textarea><button onclick="jf()">Форматировать</button><div id="jo" class="out"></div></section><section class="card"><h2>URL Encoder</h2><input id="u" placeholder="hello world"><button onclick="ue()">Encode</button><button onclick="ud()">Decode</button><div id="uo" class="out"></div></section><section class="card"><h2>Base64</h2><textarea id="b" rows="4"></textarea><button onclick="be()">Encode</button><button onclick="bd()">Decode</button><div id="bo" class="out"></div></section><section class="card"><h2>Сжатие изображения</h2><input id="im" type="file" accept="image/*"><button onclick="cp()">Сжать и скачать</button><div id="io" class="out"></div></section></div></main><script>const q=x=>document.getElementById(x);q('w').oninput=()=>q('wo').textContent='Слов: '+(q('w').value.trim()?q('w').value.trim().split(/\s+/).length:0)+' · Символов: '+q('w').value.length;function co(t){let x=q('c').value;if(t==='u')x=x.toUpperCase();if(t==='l')x=x.toLowerCase();if(t==='t')x=x.toLowerCase().replace(/(^|\s)\S/g,a=>a.toUpperCase());q('co').value=x}function jf(){try{q('jo').textContent=JSON.stringify(JSON.parse(q('j').value),null,2)}catch(e){q('jo').textContent='Ошибка JSON'}}function ue(){q('uo').textContent=encodeURIComponent(q('u').value)}function ud(){try{q('uo').textContent=decodeURIComponent(q('u').value)}catch(e){q('uo').textContent='Ошибка'}}function be(){q('bo').textContent=btoa(unescape(encodeURIComponent(q('b').value)))}function bd(){try{q('bo').textContent=decodeURIComponent(escape(atob(q('b').value)))}catch(e){q('bo').textContent='Ошибка'}}function cp(){let f=q('im').files[0];if(!f){q('io').textContent='Выберите файл';return}let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1600/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daxilo-compressed.jpg';a.click();q('io').textContent='Готово'},'image/jpeg',.78)};im.src=URL.createObjectURL(f)}</script></body></html>
