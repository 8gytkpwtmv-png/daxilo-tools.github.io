<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSON formatter онлайн"><title>JSON Formatter — DAXILO</title><link rel="canonical" href="https://8gytkpwtmv-png.github.io/daxilo-tools.github.io/json-formatter.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:20px}header div{max-width:900px;margin:auto}.logo{font-size:28px;font-weight:800}main{max-width:900px;margin:auto;padding:30px 18px}.back{color:#667085;text-decoration:none}.card{margin-top:20px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 5px 18px #1018280a}h1{font-size:34px;margin:15px 0 8px}p{color:#667085}textarea{width:100%;min-height:220px;padding:12px;border:1px solid #ccd2dc;border-radius:10px;font:inherit}button{border:0;border-radius:10px;background:#111827;color:#fff;padding:11px 15px;margin:8px 5px 8px 0;cursor:pointer}.out{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:10px;padding:14px;margin-top:10px;min-height:25px}footer{color:#667085;text-align:center;margin-top:30px;font-size:13px}</style></head><body><header><div><div class="logo">DAXILO</div></div></header><main><a class="back" href="./">← Все инструменты</a><div class="card"><h1>JSON Formatter</h1><p>Проверяйте и форматируйте JSON с понятным результатом.</p><textarea id="x" placeholder='{"name":"DAXILO"}'></textarea><button onclick="run()">Форматировать</button><button onclick="min()">Сжать</button><div id="o" class="out"></div>
<script>function run(){try{o.textContent=JSON.stringify(JSON.parse(x.value),null,2)}catch(e){o.textContent='Ошибка JSON: проверьте синтаксис'}}function min(){try{o.textContent=JSON.stringify(JSON.parse(x.value))}catch(e){o.textContent='Ошибка JSON'}}const x=document.getElementById('x'),o=document.getElementById('o');</script></div><footer>DAXILO • Бесплатный онлайн-инструмент</footer></main></body></html>
